appId: vn.edu.uit.studio
productName: UIT Studio
asar: true
disableSanityCheckAsar: true
extraMetadata:
  main: desktop-build/main.js
directories:
  output: release
files:
  - desktop-build/**/*
  - dist/**/*
  - package.json
  - "!dist/cli.*"
  - "!dist/sso-login.*"
  - "!node_modules/commander/**/*"
  - "!node_modules/playwright/**/*"
  - "!node_modules/playwright-core/**/*"
mac:
  category: public.app-category.education
  icon: assets/icon.icns
  identity: null
  target:
    - zip
    - dmg
  artifactName: UIT-Studio-macos-${arch}.${ext}
dmg:
  title: UIT Studio
linux:
  category: Education
  icon: desktop/renderer/assets/uit-dau-dau-icon.png
  target:
    - AppImage
    - tar.gz
  artifactName: UIT-Studio-linux-${arch}.${ext}
win:
  icon: desktop/renderer/assets/uit-dau-dau-icon.png
  target:
    - zip
    - nsis
  artifactName: UIT-Studio-windows-${arch}.${ext}
