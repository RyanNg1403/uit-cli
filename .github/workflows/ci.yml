name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  shared:
    name: Shared CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 10))
              echo "npm ci failed on attempt $attempt/3; retrying in ${delay}s."
              sleep "$delay"
            fi
          done
          exit 1

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --quiet

      - name: Test
        run: npm test

      - name: Test Studio web transport
        run: npm run test:studio:web

      - name: Check installer
        run: npm run installer:check

      - name: Verify npm package
        run: npm run package:check

  linux-electron:
    name: Linux Electron
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 10))
              echo "npm ci failed on attempt $attempt/3; retrying in ${delay}s."
              sleep "$delay"
            fi
          done
          exit 1

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Check desktop build
        run: npm run desktop:check

      - name: Test desktop UI
        run: npx playwright test desktop-ui pdf-preview sidebar

      - name: Test native Electron smoke and stability
        run: xvfb-run --auto-servernum npx playwright test electron-smoke electron-stability --workers=1

      - name: Build native web Studio archive
        run: npm run studio:package -- linux x64 release-assets

      - name: Smoke-test native web Studio archive
        run: node scripts/smoke-standalone-studio.mjs
        env:
          UIT_STUDIO_ARCHIVE: release-assets/UIT-Studio-web-linux-x64.tar.gz

  windows-electron:
    name: Windows Electron
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            npm ci
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt $maxAttempts) {
              $delay = $attempt * 10
              Write-Host "npm ci failed on attempt $attempt/$maxAttempts; retrying in ${delay}s."
              Start-Sleep -Seconds $delay
            }
          }
          exit 1

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Check PowerShell installer syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/install.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-Host
            exit 1
          }

      - name: Check desktop build
        run: npm run desktop:check

      - name: Test desktop UI
        # Keep Chromium contexts serialized on Windows. The runner's socket
        # table intermittently reports ERR_NO_BUFFER_SPACE with four workers.
        run: npx playwright test desktop-ui pdf-preview sidebar --workers=1

      - name: Test native Electron smoke and stability
        run: npx playwright test electron-smoke electron-stability --workers=1

      - name: Build native web Studio archive
        run: npm run studio:package -- windows x64 release-assets

      - name: Smoke-test native web Studio archive
        run: node scripts/smoke-standalone-studio.mjs
        env:
          UIT_STUDIO_ARCHIVE: release-assets/UIT-Studio-web-windows-x64.zip

  macos-electron:
    name: macOS Electron
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 10))
              echo "npm ci failed on attempt $attempt/3; retrying in ${delay}s."
              sleep "$delay"
            fi
          done
          exit 1

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Check desktop build
        run: npm run desktop:check

      - name: Test desktop UI
        # PDF.js and Chromium are resource-sensitive on hosted macOS runners;
        # one worker keeps the lifecycle tests deterministic.
        run: npx playwright test desktop-ui pdf-preview sidebar --workers=1

      - name: Test native Electron smoke and stability
        run: npx playwright test electron-smoke electron-stability --workers=1

      - name: Build native web Studio archive
        run: npm run studio:package -- macos arm64 release-assets

      - name: Smoke-test native web Studio archive
        run: node scripts/smoke-standalone-studio.mjs
        env:
          UIT_STUDIO_ARCHIVE: release-assets/UIT-Studio-web-macos-arm64.tar.gz
