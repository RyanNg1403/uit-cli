name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  shared:
    name: Shared CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --quiet

      - name: Test
        run: npm test

      - name: Check installer
        run: npm run installer:check

      - name: Verify npm package
        run: npm run package:check

  linux-electron:
    name: Linux Electron
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Check desktop build
        run: npm run desktop:check

      - name: Test desktop UI
        # Keep Chromium contexts serialized on Windows. The runner's socket
        # table intermittently reports ERR_NO_BUFFER_SPACE with four workers.
        run: npx playwright test desktop-ui pdf-preview sidebar --workers=1

      - name: Test native Electron smoke and stability
        run: xvfb-run --auto-servernum npx playwright test electron-smoke electron-stability --workers=1

  windows-electron:
    name: Windows Electron
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Check desktop build
        run: npm run desktop:check

      - name: Test desktop UI
        # PDF.js and Chromium are resource-sensitive on hosted macOS runners;
        # one worker keeps the lifecycle tests deterministic.
        run: npx playwright test desktop-ui pdf-preview sidebar --workers=1

      - name: Test native Electron smoke and stability
        run: npx playwright test electron-smoke electron-stability --workers=1

  macos-electron:
    name: macOS Electron
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Check desktop build
        run: npm run desktop:check

      - name: Test desktop UI
        run: npx playwright test desktop-ui pdf-preview sidebar

      - name: Test native Electron smoke and stability
        run: npx playwright test electron-smoke electron-stability --workers=1
