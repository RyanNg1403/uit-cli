name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build-macos:
    name: Build macOS (Apple Silicon)
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Verify tag matches package version
        run: node -e "const root = require('./package.json'); const runtime = require('./packages/uit-runtime/package.json'); const studio = require('./packages/uit-studio/package.json'); if (![runtime.version, studio.version].every((version) => version === root.version)) throw new Error('CLI, runtime, and Studio versions must match'); if (process.env.GITHUB_REF_NAME !== 'v' + root.version) throw new Error('Tag ' + process.env.GITHUB_REF_NAME + ' does not match package version v' + root.version);"

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Build unsigned macOS distributables
        run: npm run desktop:package -- --arm64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify packaged MCP on native architecture
        run: |
          response="$(printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' | "release/mac-arm64/UIT Studio.app/Contents/MacOS/UIT Studio" --uit-mcp)"
          printf '%s\n' "$response" | grep -F '"name":"uit-mcp"'
          printf '%s\n' "$response" | grep -F "\"version\":\"${GITHUB_REF_NAME#v}\""

      - name: Stage release assets and checksums
        run: |
          mkdir -p release-assets
          for extension in zip dmg; do
            asset="UIT-Studio-macos-arm64.${extension}"
            test -f "release/${asset}"
            cp "release/${asset}" "release-assets/${asset}"
            (cd release-assets && shasum -a 256 "${asset}" > "${asset}.sha256")
          done

      - name: Build standalone CLI
        run: scripts/package-standalone.sh macos arm64 release-assets

      - name: Smoke-test standalone CLI installer
        run: |
          install_home="$(mktemp -d)"
          trap 'rm -rf "$install_home"' EXIT
          HOME="$install_home" \
            UIT_INSTALL_BASE_URL="file://$PWD/release-assets" \
            scripts/install.sh --cli
          "$install_home/.local/bin/uit" --help >/dev/null
          response="$(printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' | "$install_home/.local/bin/uit" mcp)"
          printf '%s\n' "$response" | grep -F '"name":"uit-mcp"'

      - name: Upload release assets
        uses: actions/upload-artifact@v6
        with:
          name: uit-macos-arm64
          path: release-assets/*
          if-no-files-found: error

  build-linux:
    name: Build Linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Build standalone CLI
        run: |
          npm run build
          scripts/package-standalone.sh linux "${{ matrix.arch }}" release-assets

      - name: Smoke-test standalone CLI installer
        run: |
          install_home="$(mktemp -d)"
          trap 'rm -rf "$install_home"' EXIT
          HOME="$install_home" \
            UIT_INSTALL_BASE_URL="file://$PWD/release-assets" \
            scripts/install.sh --cli
          "$install_home/.local/bin/uit" --help >/dev/null
          response="$(printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' | "$install_home/.local/bin/uit" mcp)"
          printf '%s\n' "$response" | grep -F '"name":"uit-mcp"'

      - name: Upload release assets
        uses: actions/upload-artifact@v6
        with:
          name: uit-linux-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    needs: [build-macos, build-linux]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package version
        run: node -e "const { version } = require('./package.json'); if (process.env.GITHUB_REF_NAME !== 'v' + version) { throw new Error('Tag ' + process.env.GITHUB_REF_NAME + ' does not match package version v' + version); }"

      - name: Verify tagged commit is on main
        run: |
          git fetch origin main --unshallow
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --quiet

      - name: Test
        run: npm test

      - name: Check desktop build
        run: npm run desktop:check

      - name: Check installer
        run: npm run installer:check

      - name: Verify npm package
        run: npm run package:check

      - name: Verify Studio npm package
        run: npm run studio:check

      - name: Download release assets
        uses: actions/download-artifact@v7
        with:
          pattern: uit-*
          path: release-assets
          merge-multiple: true

      - name: Verify npm publisher
        run: test "$(npm whoami)" = "phatng"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish UIT runtime to npm
        run: npm publish ./packages/uit-runtime --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish UIT Studio to npm
        run: npm publish ./packages/uit-studio --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release-assets/*
          --generate-notes --verify-tag
          --notes "UIT Studio for macOS is distributed unsigned. macOS may require users to approve its first launch with Open Anyway in System Settings > Privacy & Security."
