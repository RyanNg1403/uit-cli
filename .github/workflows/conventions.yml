name: Conventions

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate-branch-and-commits:
    runs-on: ubuntu-24.04
    steps:
      - name: Check branch naming
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "Tag push detected, skipping branch convention checks."
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH="${{ github.head_ref }}"
          else
            BRANCH="${GITHUB_REF#refs/heads/}"
          fi
          echo "Validating branch: $BRANCH"
          case "$BRANCH" in
            main|release/*|feat/*|fix/*|chore/*|proj/*)
              echo "Branch name adheres to conventions."
              ;;
            *)
              echo "::error::Branch '$BRANCH' violates naming rules. Allowed: feat/**, fix/**, chore/**, proj/**, release/**, main"
              exit 1
              ;;
          esac

      - name: Checkout PR commits
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check commit message conventions
        if: github.event_name == 'pull_request'
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          echo "Checking commits between $BASE_SHA and $HEAD_SHA..."
          COMMITS=$(git log "$BASE_SHA..$HEAD_SHA" --format="%s")

          FAILED=0
          while IFS= read -r MSG; do
            [ -z "$MSG" ] && continue
            case "$MSG" in
              Merge*|"fixup!"*|"squash!"*)
                continue
                ;;
              *)
                case "$MSG" in
                  "feat:"*|"feat("*"):"*|"fix:"*|"fix("*"):"*|"chore:"*|"chore("*"):"*|"proj:"*|"proj("*"):"*)
                    continue
                    ;;
                  *)
                    echo "::error::Invalid commit message prefix (must be feat:, fix:, chore:, or proj:): '$MSG'"
                    FAILED=1
                    ;;
                esac
                ;;
            esac
          done <<< "$COMMITS"

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::One or more commits violate the supported commit message convention."
            exit 1
          fi
          echo "All commit messages adhere to conventions."
