name: Conventions

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'

jobs:
  validate-branch-and-commits:
    runs-on: ubuntu-24.04
    steps:
      - name: Check branch naming
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "Tag push detected, skipping branch convention checks."
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH="${{ github.head_ref }}"
          else
            BRANCH="${GITHUB_REF#refs/heads/}"
          fi
          echo "Validating branch: $BRANCH"
          case "$BRANCH" in
            main|release/*|feat/*|fix/*|chore/*|proj/*)
              echo "Branch name adheres to conventions."
              ;;
            *)
              echo "::error::Branch '$BRANCH' violates naming rules. Allowed: feat/**, fix/**, chore/**, proj/**, release/**, main"
              exit 1
              ;;
          esac

      - name: Checkout PR commits
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check commit message conventions
        if: github.event_name == 'pull_request'
        run: |
          BRANCH="${{ github.head_ref }}"
          case "$BRANCH" in
            feat/*) EXPECTED="feat" ;;
            fix/*) EXPECTED="fix" ;;
            chore/*) EXPECTED="chore" ;;
            proj/*) EXPECTED="proj" ;;
            release/*) EXPECTED="release_branch" ;;
            *) EXPECTED="any" ;;
          esac

          if [ "$EXPECTED" = "any" ]; then
            exit 0
          fi

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          echo "Checking commits between $BASE_SHA and $HEAD_SHA (branch rule: $EXPECTED)..."
          COMMITS=$(git log "$BASE_SHA..$HEAD_SHA" --format="%s")

          FAILED=0
          while IFS= read -r MSG; do
            [ -z "$MSG" ] && continue
            case "$MSG" in
              Merge*|"fixup!"*|"squash!"*)
                continue
                ;;
              *)
                if [ "$EXPECTED" = "release_branch" ]; then
                  case "$MSG" in
                    "feat:"*|"feat("*"):"*|"fix:"*|"fix("*"):"*|"chore:"*|"chore("*"):"*|"proj:"*|"proj("*"):"*)
                      continue
                      ;;
                    *)
                      echo "::error::Invalid commit message on release branch (must be feat:, fix:, chore:, or proj:): '$MSG'"
                      FAILED=1
                      ;;
                  esac
                else
                  case "$MSG" in
                    "$EXPECTED:"*|"$EXPECTED("*"):"*)
                      continue
                      ;;
                    *)
                      echo "::error::Commit message does not match branch prefix '$EXPECTED': '$MSG'"
                      FAILED=1
                      ;;
                  esac
                fi
                ;;
            esac
          done <<< "$COMMITS"

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::One or more commits violate the commit message convention for branch '$BRANCH'."
            exit 1
          fi
          echo "All commit messages adhere to conventions."
